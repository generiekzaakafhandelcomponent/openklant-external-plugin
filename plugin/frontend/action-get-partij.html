<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Open Klant</title>
  <link rel="stylesheet" href="https://unpkg.com/@carbon/styles@1.71.0/css/styles.min.css" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'IBM Plex Sans', sans-serif; background: transparent; }
    .cds--form-item { margin-bottom: 1.5rem; }
    .cds--label { font-size: var(--cds-label-01-font-size, 0.75rem); font-weight: var(--cds-label-01-font-weight, 400); line-height: var(--cds-label-01-line-height, 1.33333); letter-spacing: var(--cds-label-01-letter-spacing, 0.32px); display: inline-block; color: var(--cds-text-secondary, #525252); margin-block-end: 0.5rem; vertical-align: baseline; }
    .cds--label .required { color: var(--cds-text-secondary, #525252); }
    .cds--label .tooltip { width: 1rem; height: 1rem; fill: currentColor; vertical-align: middle; margin-left: 0.25rem; }
    .cds--text-input { width: 100%; height: 2.5rem; padding: 0 1rem; border: none; border-bottom: 1px solid var(--cds-border-strong, #8d8d8d); background-color: var(--cds-field, #f4f4f4); font-size: 0.875rem; outline: none; color: var(--cds-text-primary, #161616); }
    .cds--text-input:focus { outline: 2px solid var(--cds-focus, #0f62fe); outline-offset: -2px; }
    .cds--form__helper-text { margin-top: 0.25rem; font-size: 0.75rem; color: var(--cds-text-helper, #6f6f6f); }
    /* Dark mode overrides - only via Valtimo theme attribute */
    [data-carbon-theme="g100"], [data-carbon-theme="g90"] {
      --cds-text-secondary: #c6c6c6;
      --cds-text-primary: #f4f4f4;
      --cds-text-helper: #a8a8a8;
      --cds-field: #525252;
      --cds-border-strong: #6f6f6f;
      --cds-icon-secondary: #c6c6c6;
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script src="action-get-partij.bundle.js"></script>
</body>
</html>
